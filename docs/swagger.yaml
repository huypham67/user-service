definitions:
  gin.H:
    additionalProperties: {}
    type: object
  github_com_huypham67_user-service_internal_dto_auth.LoginRequest:
    properties:
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  github_com_huypham67_user-service_internal_dto_auth.LoginResponse:
    properties:
      data:
        type: string
      message:
        type: string
      pagination:
        $ref: '#/definitions/response.Pagination'
    type: object
  github_com_huypham67_user-service_internal_dto_auth.RegisterUserRequest:
    properties:
      display_name:
        maxLength: 100
        minLength: 2
        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - display_name
    - email
    - password
    - username
    type: object
  github_com_huypham67_user-service_internal_dto_auth.RegisterUserResponse:
    properties:
      data:
        $ref: '#/definitions/github_com_huypham67_user-service_internal_dto_auth.UserData'
      message:
        type: string
      pagination:
