    type: object
  github_com_huypham67_user-service_internal_dto_auth.UserData:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  github_com_huypham67_user-service_internal_dto_health.HealthCheckResponse:
    properties:
      instance_id:
        type: string
      message:
        type: string
      service_name:
        type: string
    type: object
  github_com_huypham67_user-service_internal_dto_profile.UpdateUserRequest:
    properties:
      display_name:
        maxLength: 100
        minLength: 2
        type: string
      email:
        type: string
    type: object
  github_com_huypham67_user-service_internal_dto_profile.UpdateUserResponse:
    type: object
  github_com_huypham67_user-service_internal_dto_profile.UserData:
    properties:
      created_at:
        type: string
